name: Verify Branch (fork-local)

# Fork-only CI check for work-in-progress branches, before opening a PR upstream.
# Scoped to work-in-progress branches so it never touches the existing `Build` workflow's main-branch
# trigger, and is meant to be removed (or simply not carried over) before a PR is sent
# to the upstream repository — it exists only to verify compilation/tests on this fork.

on:
  push:
    branches:
      - 'claude/**'
      - 'ccr-*'
      - 'multi-currency'
  workflow_dispatch:

concurrency:
  group: verify-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-test:
    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug (compiles every module)
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Run unit tests
        if: always()
        run: ./gradlew test

      - name: Spotless check
        if: always()
        run: ./gradlew spotlessCheck
